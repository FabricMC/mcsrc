name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: ./gradlew build
        working-directory: java
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: java-libs
          path: java/build/libs/

  desktop:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: ./gradlew build
        working-directory: java
      - run: npm ci
      - run: make build-all
      - name: Package desktop apps
        run: |
          tar -czf mcsrc-macos-arm64.tar.gz -C desktop-dist/macos mcsrc.app
          tar -czf mcsrc-windows-x64.tar.gz -C desktop-dist/windows mcsrc
          tar -czf mcsrc-linux-x64.tar.gz -C desktop-dist/linux mcsrc.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: mcsrc-macos-arm64
          path: mcsrc-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mcsrc-windows-x64
          path: mcsrc-windows-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mcsrc-linux-x64
          path: mcsrc-linux-x64.tar.gz

  e2e-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: ubuntu-24.04
            browser: firefox
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: java-libs
          path: java/build/libs/
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.browser }}
          path: playwright-report/
